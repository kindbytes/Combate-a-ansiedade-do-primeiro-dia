<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Combate a ansiedade do primeiro dia</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #fff;
            --fg: #1f2328;
            --mut: #5b6470;
            --bd: #dde1e6;
            --ac: #1d7a46;
            --acbg: #e3f4ea;
            --bad: #b3261e;
            --hd: #eef0f3;
            --tg: #fff4c2;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #15181c;
                --card: #1e2227;
                --fg: #e8eaed;
                --mut: #9aa3ad;
                --bd: #343a41;
                --ac: #4cc27f;
                --acbg: #1d3326;
                --bad: #ff8a80;
                --hd: #2a2f35;
                --tg: #4a4219;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #15181c;
            --card: #1e2227;
            --fg: #e8eaed;
            --mut: #9aa3ad;
            --bd: #343a41;
            --ac: #4cc27f;
            --acbg: #1d3326;
            --bad: #ff8a80;
            --hd: #2a2f35;
            --tg: #4a4219;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px
        }

        h1 {
            font-size: 1.4rem;
            margin: .2em 0
        }

        .bar {
            height: 8px;
            background: var(--hd);
            border-radius: 99px;
            overflow: hidden;
            margin: 8px 0 12px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width .3s
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px
        }

        .card p {
            margin: .3em 0
        }

        code {
            font-family: ui-monospace, Consolas, monospace;
            background: var(--hd);
            padding: 1px 6px;
            border-radius: 5px
        }

        .tip {
            background: var(--acbg);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px
        }

        .ok {
            color: var(--ac);
            font-weight: 700
        }

        .row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 7px 13px;
            font: inherit;
            cursor: pointer;
            background: var(--ac);
            color: #fff
        }

        .btn.g {
            background: var(--hd);
            color: var(--fg)
        }

        .fb {
            display: flex;
            gap: 8px;
            margin-bottom: 8px
        }

        #nb {
            min-width: 54px;
            text-align: center;
            border: 1px solid var(--bd);
            background: var(--hd);
            border-radius: 8px;
            padding: 7px 8px;
            font-weight: 700
        }

        #fx {
            flex: 1;
            min-width: 0;
            font: inherit;
            font-family: ui-monospace, Consolas, monospace;
            padding: 7px 10px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--card);
            color: var(--fg)
        }

        .tw {
            overflow-x: auto;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--card)
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th,
        td {
            border: 1px solid var(--bd);
            padding: 4px 10px;
            white-space: nowrap;
            min-width: 92px;
            height: 30px;
            cursor: cell;
            user-select: none
        }

        th {
            background: var(--hd);
            color: var(--mut);
            font-weight: 600;
            text-align: center;
            min-width: 34px;
            cursor: default
        }

        tr:first-child th {
            min-width: 92px
        }

        tr:first-child th:first-child {
            min-width: 34px
        }

        td.h {
            font-weight: 700;
            background: var(--hd)
        }

        td.tg {
            background: var(--tg)
        }

        td.sel {
            outline: 2px solid var(--ac);
            outline-offset: -2px
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0
        }

        .stats span {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 6px 12px
        }

        .tree {
            font: 14px/1.15 ui-monospace, Consolas, monospace;
            color: var(--ac);
            width: max-content;
            max-width: 100%;
            overflow-x: auto;
            margin: 10px auto;
            white-space: pre
        }

        .gs {
            color: #e6a700
        }

        .ns {
            color: #e5484d
        }

        .mut {
            color: var(--mut);
            margin: 4px 0
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 12px
        }

        .day {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
            font: inherit;
            color: var(--fg);
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer
        }

        .day i {
            font-style: normal;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ac)
        }

        .day span {
            font-size: .9rem
        }

        .day em {
            font-style: normal;
            font-size: .8rem;
            color: var(--mut)
        }

        .day.dn {
            background: var(--acbg);
            border-color: var(--ac)
        }

        .day.lk {
            opacity: .5;
            cursor: not-allowed
        }

        html:root:not([data-theme="x"]) {
            --bg: #0b0d10;
            --card: #11151a;
            --fg: #d7dde4;
            --mut: #7d8793;
            --bd: #252c34;
            --ac: #7ba7e0;
            --acbg: #142033;
            --hd: #171c22;
            --tg: #3a3412;
            --bad: #ff7b72;
            color-scheme: dark
        }

        body {
            font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace
        }

        h1 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: .02em;
            margin: .4em 0
        }

        h1::before {
            content: "$ ";
            color: var(--ac)
        }

        .cur {
            color: var(--ac);
            animation: bl 1s steps(1) infinite
        }

        @keyframes bl {
            50% {
                opacity: 0
            }
        }

        .bar {
            height: 3px;
            border-radius: 0
        }

        .card,
        .tw,
        #nb,
        #fx,
        .btn,
        code {
            border-radius: 4px
        }

        .tip {
            background: var(--acbg);
            border-left: 3px solid var(--ac);
            border-radius: 0 4px 4px 0
        }

        code {
            color: var(--ac)
        }

        .btn {
            background: transparent;
            color: var(--ac);
            border: 1px solid var(--ac);
            padding: 6px 12px
        }

        .btn:hover {
            background: var(--acbg)
        }

        .btn.g {
            color: var(--mut);
            border-color: var(--bd)
        }

        .btn.g:hover {
            color: var(--fg);
            background: var(--hd)
        }

        th {
            font-weight: 500
        }

        td.h {
            color: var(--ac)
        }

        html:root:not([data-theme="x"]) {
            --fg: #d3d9e0;
            --mut: #8b96a3;
            --bd: #2a313a
        }

        body {
            font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .wrap {
            max-width: 820px;
            padding: 24px 16px
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 14px
        }

        .bar {
            margin: 0 0 20px
        }

        .card {
            padding: 20px 22px;
            margin-bottom: 20px
        }

        .card p {
            margin: 0 0 12px;
            max-width: 62ch
        }

        .card p:last-child {
            margin-bottom: 0
        }

        .tip {
            padding: 12px 16px;
            margin: 14px 0;
            line-height: 1.8;
            max-width: 62ch
        }

        code {
            font: .9em ui-monospace, Menlo, Consolas, monospace;
            padding: 2px 6px
        }

        .row {
            margin-top: 18px;
            gap: 10px
        }

        .btn {
            font-size: .9rem;
            padding: 8px 14px
        }

        .btn.g {
            border-color: transparent;
            padding: 8px 10px
        }

        .fb {
            margin-bottom: 10px
        }

        #fx,
        #nb {
            font-size: .9rem
        }

        td,
        th {
            font-size: .9rem
        }

        .tw~.tip {
            background: none;
            border-left: 0;
            color: var(--mut);
            font-size: .85rem;
            padding: 12px 0;
            margin: 10px 0;
            max-width: none
        }

        .st {
            list-style: none;
            counter-reset: s;
            margin: 10px 0 0;
            padding: 0
        }

        .st li {
            counter-increment: s;
            position: relative;
            padding: 3px 0 3px 38px;
            margin: 0 0 8px;
            min-height: 28px
        }

        .st li::before {
            content: counter(s);
            position: absolute;
            left: 0;
            top: 2px;
            width: 26px;
            height: 26px;
            border: 1px solid var(--ac);
            border-radius: 50%;
            color: var(--ac);
            font-size: .8rem;
            display: flex;
            align-items: center;
            justify-content: center
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        .wrap {
            max-width: 1200px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px
        }

        #work {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            grid-template-rows: auto minmax(0, 1fr) auto auto;
            column-gap: 20px
        }

        #ms {
            grid-column: 1;
            grid-row: 1/5;
            min-height: 0;
            overflow-y: auto;
            margin: 0
        }

        .fb {
            grid-column: 2;
            grid-row: 1
        }

        .tw {
            grid-column: 2;
            grid-row: 2;
            min-height: 0;
            overflow: auto
        }

        .tw~.tip {
            grid-column: 2;
            grid-row: 3
        }

        #work>.row {
            grid-column: 2;
            grid-row: 4;
            margin-top: 0;
            padding-bottom: 4px
        }

        @media (max-width:1000px) {
            #work {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 45%) auto minmax(0, 1fr) auto
            }

            #ms {
                grid-column: 1;
                grid-row: 1;
                margin-bottom: 10px
            }

            .fb {
                grid-column: 1;
                grid-row: 2
            }

            .tw {
                grid-column: 1;
                grid-row: 3
            }

            .tw~.tip {
                display: none
            }

            #work>.row {
                grid-column: 1;
                grid-row: 4
            }
        }

        .app {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 16px
        }

        .main {
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        #home {
            flex: 1;
            min-height: 0;
            overflow-y: auto
        }

        #nav {
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px
        }

        .ni {
            position: relative;
            display: block;
            width: 100%;
            text-align: left;
            font: inherit;
            color: var(--fg);
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 4px;
            padding: 7px 30px 7px 10px;
            cursor: pointer
        }

        .ni b {
            display: block;
            color: var(--ac);
            font-size: .85rem;
            font-weight: 600
        }

        .ni small {
            display: block;
            color: var(--mut);
            font-size: .78rem;
            line-height: 1.3
        }

        .ni span {
            position: absolute;
            right: 8px;
            top: 8px
        }

        .ni.on {
            border-color: var(--ac);
            background: var(--acbg)
        }

        .ni.lk {
            opacity: .5;
            cursor: not-allowed
        }

        @media (max-width:1000px) {
            .app {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                gap: 10px
            }

            #nav {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 0 0 4px
            }

            .ni {
                width: auto;
                min-width: 135px;
                flex: none
            }
        }

        @media (min-width:1001px) {
            .wrap {
                max-width: 1680px
            }

            .app {
                grid-template-columns: 190px minmax(0, 1fr)
            }

            #work {
                grid-template-columns: minmax(0, .8fr) minmax(0, 1.4fr);
                column-gap: 16px
            }
        }

        td {
            min-width: 70px;
            padding: 4px 7px
        }

        th {
            padding: 4px 6px
        }

        tr:first-child th {
            min-width: 70px
        }
    </style>
</head>

            {
                t: "Status de faltas", c: "G2", x: "Na <b>G2</b>, mostre “Atenção” se a pessoa tiver 1 falta ou mais (coluna F), senão “OK”. Use <code>SE(condição; se verdadeiro; se falso)</code>. Quando acertar, a fórmula é copiada para as outras linhas.", h: "=SE(F2>=1;\"Atenção\";\"OK\")",

        var LS = [
            "<p>A função <code>SOMA</code> soma vários números de uma vez, sem precisar somar célula por célula.</p><div class='tip'>Estrutura: <code>=SOMA(intervalo)</code><br>Um <b>intervalo</b> usa dois pontos: <code>E2:E8</code> quer dizer “de E2 até E8”.<br>Exemplo: <code>=SOMA(E2:E8)</code> soma todas as horas extras.</div><p><b>Passo a passo</b></p><ol class='st'><li>Clique na célula onde o resultado vai aparecer.</li><li>Na barra de fórmulas, digite <code>=SOMA(</code></li><li>Clique na primeira célula do intervalo (E2), digite <code>:</code> e clique na última (E8).</li><li>Digite <code>)</code> e aperte Enter.</li></ol>",
            "<p>A função <code>MÉDIA</code> soma tudo e divide pela quantidade de valores. É usada igual à SOMA.</p><div class='tip'>Estrutura: <code>=MÉDIA(intervalo)</code><br>Exemplo: <code>=MÉDIA(F2:F8)</code> calcula a média de faltas por pessoa.</div>",
            "<p>O <code>CONT.SE</code> conta quantas células atendem a uma condição.</p><div class='tip'>Estrutura: <code>=CONT.SE(onde procurar; o que procurar)</code><br>Textos ficam entre aspas, e o ponto e vírgula separa as partes.<br>Exemplo: <code>=CONT.SE(C2:C8;&quot;Analista&quot;)</code> conta quantos analistas existem.</div>",
            "<p>O <code>SOMASE</code> soma só os valores que atendem a uma condição. É como o CONT.SE, mas com uma parte a mais: o que somar.</p><div class='tip'>Estrutura: <code>=SOMASE(onde procurar; o que procurar; o que somar)</code><br>Exemplo: <code>=SOMASE(B2:B8;&quot;RH&quot;;E2:E8)</code> soma as horas extras apenas de quem é do RH.</div>",
            "<p>O <code>SE</code> faz a planilha tomar uma decisão. Ele tem três partes: um teste, o que mostrar se o teste for verdadeiro e o que mostrar se for falso.</p><div class='tip'>Estrutura: <code>=SE(teste; se verdadeiro; se falso)</code><br>Exemplo: <code>=SE(D2&gt;3000;&quot;Alto&quot;;&quot;Baixo&quot;)</code> mostra “Alto” se o salário passar de 3000.<br>Comparações: <code>&gt;</code> maior, <code>&lt;</code> menor, <code>&gt;=</code> maior ou igual, <code>=</code> igual, <code>&lt;&gt;</code> diferente.</div>",
            "<p>O <code>PROCV</code> funciona como procurar um nome numa lista e ler outra informação da mesma linha.</p><div class='tip'>Estrutura: <code>=PROCV(o que procurar; tabela; número da coluna; 0)</code><br>O <b>número da coluna</b> conta a partir da primeira coluna da tabela (A = 1, B = 2…). O <code>0</code> no final pede o valor exato.<br>Exemplo: <code>=PROCV(&quot;Carla Dias&quot;;A2:F8;5;0)</code> devolve as horas extras da Carla (5ª coluna de A até F).</div>",
            "<p>As funções <code>MÁXIMO</code> e <code>MÍNIMO</code> acham o maior e o menor valor de um intervalo.</p><div class='tip'>Estrutura: <code>=MÁXIMO(intervalo)</code><br>Exemplo: <code>=MÁXIMO(E2:E8)</code> mostra quem fez mais horas extras (o valor). <code>=MÍNIMO(E2:E8)</code> mostra o menor.</div>"];

        M.push(

            { t: "Hora extra do Bruno", c: "D17", x: 'Na <b>D17</b>, calcule quanto o Bruno recebe de horas extras. Valor da hora = salário ÷ 220 (horas de trabalho no mês). A hora extra rende 50% a mais, ou seja, ×1,5 (no Excel, use <code>*</code>). Monte: salário ÷ 220 × 1,5 × horas extras.', h: '=D3/220*1,5*E3', ok: function () { return isF("D17") && near(val("D17"), C("D3") / 220 * 1.5 * C("E3")) } },

        LS.push("<p>Dá para usar sinais dentro do critério do <code>CONT.SE</code> e contar valores maiores ou menores que algo. No RH isso serve para ver quem teve falta ou atraso.</p><div class='tip'>Estrutura: <code>=CONT.SE(intervalo;&quot;&gt;0&quot;)</code><br>O sinal e o número ficam juntos, dentro das aspas.<br>Exemplo: <code>=CONT.SE(D2:D8;&quot;&gt;=4000&quot;)</code> conta quem ganha 4000 ou mais.</div>",
            "<p>No RH, uma conta que aparece sempre é a da hora extra. Primeiro se acha o valor de uma hora normal, depois se aplica o adicional.</p><div class='tip'>Valor da hora = salário ÷ 220<br>Hora extra com adicional de 50% = valor da hora × 1,5<br>Total = valor da hora × 1,5 × horas extras<br>Exemplo: <code>=D2/220*1,5*E2</code><br>O 220 é a jornada mensal de quem trabalha 44 horas por semana. Confirme sempre a regra com a gestora ou o contador, pois acordo ou convenção da empresa pode mudar o percentual.</div>",
            "<p>O <code>SOMASE</code> serve para fechar números por área, algo que o RH faz o tempo todo para dividir custos entre setores.</p><div class='tip'>Exemplo: <code>=SOMASE(B2:B8;&quot;RH&quot;;F2:F8)</code> soma as faltas só do RH.</div>");

        function pd(v) { var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(v)); return m ? new Date(+m[3], m[2] - 1, +m[1]) : null }

        M.push(
            { t: "Alerta do motorista", c: "D19", x: 'Na <b>D19</b>, mostre “Revisar” se o Bruno (linha 3) for <b>Motorista</b> <u>e</u> tiver mais de 10 horas extras. Senão, “OK”. Use <code>E(condição1; condição2)</code> dentro do SE: as duas precisam ser verdadeiras.', h: '=SE(E(C3="Motorista";E3>10);"Revisar";"OK")', ok: function () { return isF("D19") && /SE\(E\(/.test(nzf("D19")) && nz(val("D19")) == "revisar" } },
            { t: "Atenção dupla", c: "D20", x: 'Na <b>D20</b>, mostre “Atenção” para a Elisa (linha 6) se ela tiver mais de 10 horas extras <u>ou</u> alguma falta. Senão, “OK”. Use <code>OU(condição1; condição2)</code>: basta uma ser verdadeira.', h: '=SE(OU(E6>10;F6>0);"Atenção";"OK")', ok: function () { return isF("D20") && /SE\(OU\(/.test(nzf("D20")) && nz(val("D20")) == "atencao" } },
            { t: "Tempo de casa", c: "D21", x: 'A Helloah Sarah foi admitida em <b>01/03/2025</b> (célula C21). Na <b>D21</b>, calcule há quantos <b>meses</b> ela está na empresa. <code>HOJE()</code> devolve a data de hoje e <code>DATADIF(início; fim; "M")</code> conta os meses entre duas datas.', h: '=DATADIF(C21;HOJE();"M")', ok: function () { return isF("D21") && /DATADIF\(/.test(nzf("D21")) && /HOJE\(/.test(nzf("D21")) && val("D21") === mesesHelloahSarah() } });
        LS.push("<p>Às vezes a regra tem <b>duas condições juntas</b>. Para isso, use <code>E</code> dentro do <code>SE</code>: o resultado só é verdadeiro se <b>todas</b> as condições forem verdadeiras.</p><div class='tip'>Estrutura: <code>=SE(E(condição1; condição2); se verdadeiro; se falso)</code><br>Exemplo: <code>=SE(E(B2=&quot;Frota&quot;;F2&gt;0);&quot;Revisar&quot;;&quot;OK&quot;)</code> marca quem é da Frota <b>e</b> faltou.<br>Se uma das duas for falsa, o resultado é “OK”.</div>",
            "<p>O <code>OU</code> é parecido com o E, mas basta <b>uma</b> condição ser verdadeira.</p><div class='tip'>Estrutura: <code>=SE(OU(condição1; condição2); se verdadeiro; se falso)</code><br>Exemplo: <code>=SE(OU(D2&lt;2000;F2&gt;2);&quot;Ver&quot;;&quot;OK&quot;)</code> marca quem ganha menos de 2000 <b>ou</b> teve mais de 2 faltas.<br>Resumo: <b>E</b> = todas precisam valer. <b>OU</b> = uma já basta.</div>",
            "<p>Datas são muito usadas no RH: tempo de casa, fim do contrato de experiência, férias e, numa transportadora, validade de CNH e de exame médico dos motoristas.</p><div class='tip'><code>=HOJE()</code> mostra a data de hoje e muda sozinha a cada dia.<br><code>=DATADIF(início; fim; &quot;M&quot;)</code> conta os meses entre duas datas. Use <code>&quot;Y&quot;</code> para anos e <code>&quot;D&quot;</code> para dias.<br>Exemplo: <code>=DATADIF(C2;HOJE();&quot;D&quot;)</code> mostra quantos dias se passaram desde a data de C2.<br>Dica: para ver quantos dias faltam para vencer a CNH, inverta: <code>=DATADIF(HOJE();data_da_CNH;&quot;D&quot;)</code>.</div>");

            "<p><b>👋 Primeiros passos: o que é uma planilha?</b></p><p>No RH, boa parte do trabalho é organizar dados de colaboradores em planilhas como esta.</p><p>Uma planilha é uma tabela gigante. As <b>colunas</b> têm letras (A, B, C…) e as <b>linhas</b> têm números (1, 2, 3…).</p><div class='tip'>Cada quadradinho se chama <b>célula</b>, e o nome dela é a coluna + a linha. A célula onde a coluna <b>D</b> encontra a linha <b>2</b> é a <code>D2</code>. Aqui, ela guarda o salário da Ana.<br>Teste: clique em algumas células e veja o nome aparecer na caixinha à esquerda, acima da planilha.</div>",
            "<p><b>✏️ Como escrever numa célula</b></p><p>Clique na célula e digite na <b>barra de fórmulas</b>, que fica logo acima da planilha. Aperte <b>Enter</b> para confirmar.</p><div class='tip'>Texto e números são digitados do mesmo jeito. Para apagar uma célula, deixe a barra vazia e aperte Enter.<br>Teste: clique na célula <code>A1</code>, mude o texto e aperte Enter. Para desfazer, use “Restaurar planilha”.</div>",
            "<p><b>🧮 Fórmulas sempre começam com =</b></p><p>Quando você digita <code>=</code> no começo, o Excel entende que é uma conta, não um texto.</p><div class='tip'><code>=2+3</code> mostra 5. Os sinais são <code>+</code> somar, <code>-</code> subtrair, <code>*</code> multiplicar e <code>/</code> dividir.<br>Você também pode usar células na conta: <code>=D2+D3</code> soma o salário da Ana com o do Bruno. Se você mudar um desses salários, o resultado muda sozinho. Essa é a grande vantagem do Excel.</div>",
            "<p><b>🧰 Funções e intervalos</b></p><p>Uma <b>função</b> é uma conta pronta, como a <code>SOMA</code>. Ela tem um nome e parênteses, e o que vai dentro dos parênteses diz com o que ela deve trabalhar.</p><div class='tip'>Um <b>intervalo</b> usa dois pontos: <code>D2:D8</code> quer dizer “da D2 até a D8”.<br>O <b>ponto e vírgula</b> <code>;</code> separa as partes de uma função.<br>Textos ficam entre <b>aspas</b>: <code>\"TI\"</code>.<br>Dica: dentro de uma fórmula, em vez de digitar o nome da célula, é só <b>clicar nela</b>.</div>",

            document.getElementById("pb").style.width = (Object.keys(done).length / M.length * 100) + "%";
            save(); renderMs(); renderHome(); renderNav(); document.getElementById("home").style.display = view == "home" ? "" : "none"; document.getElementById("work").style.display = view == "home" ? "none" : ""
        }
        function renderMs() {
            var n = Object.keys(done).length;
            if (inI()) {
                var L = IT.length - 1, ok = ip == L && introOk();
                ms.innerHTML = IT[ip] + (ok ? "<p class='ok'>✓ Perfeito! Deu " + fmt(val("F10")) + ". Agora você já sabe o básico.</p>" : "") + "<div class='row'>" + (ip > 0 ? "<button class='btn g' data-a='ib'>← Voltar</button>" : "") + (ip < L ? "<button class='btn' data-a='ia'>Próximo →</button>" : "<button class='btn" + (ok ? "" : " g") + "' data-a='is'>Começar as missões →</button>") + "</div><p style='color:var(--mut);font-size:.85rem'>Passo " + (ip + 1) + " de " + IT.length + "</p>"; return
            }
            if (false) { ms.innerHTML = "<p class='ok'>🎉 Você concluiu as " + M.length + " missões!</p><p>Agora explore: mude os salários, troque a área de alguém e veja as fórmulas se atualizarem sozinhas.</p>"; return }
            var m = M[mi], d = done[mi];
            if (!d && !learned[mi]) { ms.innerHTML = "<p><b>📖 Lição " + (mi + 1) + " de " + M.length + ": " + m.t + "</b> (primeiro entenda, depois pratique)</p>" + LS[mi] + "<div class='row'><button class='btn g' data-a='p'>← Anterior</button><button class='btn' data-a='l'>Entendi, vamos praticar →</button></div>"; return }
            ms.innerHTML = "<p><b>Missão " + (mi + 1) + " de " + M.length + ": " + m.t + "</b> (" + n + " concluídas)</p><p>" + m.x + "</p><p class='mut'>A célula amarela é só uma sugestão. Se você fizer a fórmula em outra célula e der o mesmo resultado, a missão também vale.</p>" + (d ? "<p class='ok'>✓ Correto! Muito bem.</p>" : "") + (hint && !d ? "<div class='tip'>Dica: <code>" + m.h.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</code></div>" : "") +
                "<div class='row'><button class='btn g' data-a='p'>← Anterior</button><button class='btn g' data-a='r'>📖 Rever lição</button>" + (d ? "" : "<button class='btn g' data-a='h'>" + (hint ? "Esconder dica" : "Ver dica") + "</button>") + "<button class='btn" + (d ? "" : " g") + "' data-a='n'>" + (d ? "Próxima missão →" : "Pular →") + "</button></div>"
        }
        ms.onclick = function (e) { var a = e.target.dataset.a; if (!a) return; if (a == "c") view = "home"; else if (a == "ia") ip++; else if (a == "ib") ip--; else if (a == "is") { if (!intro && introOk()) gold.i = 1; intro = 1; rev = 0; delete cells["F10"]; select(M[mi].c) } else if (a == "h") { hint = !hint; if (hint) hinted[mi] = 1 } else if (a == "l") learned[mi] = 1; else if (a == "r") learned[mi] = 0; else { hint = false; mi = (mi + (a == "n" ? 1 : M.length - 1)) % M.length; select(M[mi].c) } refresh() };
        function select(r) { sel = r; fx.value = cells[r] || ""; nb.textContent = r; dirty = false; Array.prototype.forEach.call(all(), function (td) { td.classList.toggle("sel", td.dataset.r == r) }) }
        function commit() { if (!dirty) return; dirty = false; var v = fx.value; if (v.trim() === "") delete cells[sel]; else cells[sel] = v; refresh() }
        fx.oninput = function () { dirty = true };
        fx.onblur = commit;
        fx.onkeydown = function (e) { if (e.key == "Enter") { commit(); var m = /([A-Z])(\d+)/.exec(sel); if (+m[2] < 21) select(m[1] + (+m[2] + 1)); fx.focus(); e.preventDefault() } else if (e.key == "Escape") { select(sel) } };
        g.addEventListener("mousedown", function (e) {
            var td = e.target.closest("td"); if (!td) return; e.preventDefault(); var r = td.dataset.r;
            if (document.activeElement === fx && /^=/.test(fx.value) && /[=(;+\-*\/:,<>]$/.test(fx.value)) { fx.value += r; dirty = true; return }
            commit(); select(r); if (window.matchMedia("(pointer:fine)").matches) fx.focus()
        });
        document.getElementById("rs").onclick = function () { cells = fresh(); select(sel); refresh() };
        mi = 0; for (var i = 0; i < M.length; i++) { if (!done[i]) { mi = i; break } }
        select(intro ? "D10" : "A1"); refresh();
    </script>
